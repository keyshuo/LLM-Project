[project]
name = "llm-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wang Xiao", email = "93336250+keyshuo@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "structlog>=26.1.0",
]

[project.scripts]
llm-project = "llm_project:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pydantic-settings>=2.16.1",
    "ruff>=0.17.2",
    "structlog>=26.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
